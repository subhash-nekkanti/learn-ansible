- name: Install nginx and start
  hosts: frontend   #so now its not local so it will expect username and password and ip, ip is already uploaded in inventory.ini
  become: yes #providing root access
  tasks:
    - name: Install nginx
      package:  #or ansible.builtin.package
        name: nginx
        state: present
    - name: start nginx
      ansible.builtin.service: #or just service: for strat and enabling nginx
        name: nginx
        state: started
        enabled: yes
    
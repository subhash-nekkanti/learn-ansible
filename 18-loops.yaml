- name: install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - {name: 'nginx' , state: present }
    - {name: 'mysql' , state: absent }
    - {name: 'git' , state: present }
    - {name: 'net-tools' , state: absent }
    - {name: 'htop' , state: present }
  tasks: 
  - name: Install packages
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"
- name: Course Information with Datatypes
  hosts: local
  connection: local
  vars:
    course: DevSecOps with AiOps  #string
    Duration_In_Months: 4  #int
    Live_Sessions: yes  #boolean
    topics:  #list
    - Linux
    - Ansible
    - Terraform
    - Kubernetes
    Additional_details:  #map/dict
      tariner: sivakumar
      price: 24999
    exact_duration_in_months: 4.5  #float
  tasks:
  - name: print full detailed course information
    debug:
      msg: |
        course : {{ course }} : {{ course | type_debug }}                             
        duration : {{ Duration_In_Months }} : {{ Duration_In_Months | type_debug }}
        are_live_sessions_available : {{ Live_Sessions }} : {{ Live_Sessions | type_debug }}
        Topics_discussed_in_course : {{ topics }} : {{ topics | type_debug }}
        additional_course_details : {{ Additional_details }} : {{ Additional_details | type_debug }}
        exact_duration_in_months: {{ exact_duration_in_months }} : {{ exact_duration_in_months | type_debug}}
        {{ hello world  | type_debug }} 


#type_debug prints Datatypes
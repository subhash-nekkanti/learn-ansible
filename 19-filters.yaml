- name: demo no filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, Shell, Ansible, Terraform, Docker"
    names:
    - Rama
    - Subhash
    - Nekkanti
    topic: ANSIBLE
    duration: "4"
  tasks:
  - name: print name without defined variable
    debug:
      msg: Hi I am {{ person_name | default('Subhash') }}  #person_name is not defined so it throws error so we can pass a variable without defining by giving default value with default("...") command
    
  - name: convert string to list 
    debug:
     msg: "Topics are: {{ topics | split(',') }}"


#topics is the variable defines
#split is used to cut the string to list (, coma) specifies where to cut the string ---> 
#linux, Shell, ansible all are stored in a string so we split the string using ',' and make linux shell and ansible in the form of list.


  - name: convert list to string
    debug:
      msg: "Full name: {{ names | join(' ') }}"

  - name: convert to lower case
    debug:
      msg: "Topic: {{ topic | lower }}"
  
  - name: convert to string to int
    debug:
      msg: "Duration: {{ duration | int }}"
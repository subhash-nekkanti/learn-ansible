- name: create username
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check roboshop user exist or not
    command: id roboshop #linux command, when there is no ansible module exists
    register: user_output    #stores output of command i.e id roboshop into user_output variable it contains rc,stdout,stderr,failed...etc
    ignore_errors: true

  - name: print the user_output
    debug:
      msg: "{{ user_output }}"

  - name: create user
    command: useradd roboshop
    when: user_output.rc != 0   #we take rc from stored output in user_output
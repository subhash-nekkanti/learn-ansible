- name: Install Nginx Acc to OS
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: Install Nginx in RedHat
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"

  - name: Install Nginx in RedHat
    apt:
      name: nginx
      state: present
    when: ansible_facts.os_family == "Debian"
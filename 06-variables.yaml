- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    time: "12 hours"
    marks: 95
  tasks:
  - name: printing the variables
    debug:
      msg: "I studied for almost {{ time }} a day and I scored {{ marks }} marks in my first semester examination"

  tasks:
  - name: printing the variables
    vars:
     marks: "45"
     time: "12 hours"
    debug:
      msg: "Eventhough I studied for {{ time }} a day, I scored only {{ marks }} marks in my first semester examination"
- name: print gather facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug: 
      msg: "{{ ansible_facts }}"
  - name: gather some info from ansible_facts
    debug:
      msg: |
      OS_FAMILY: {{ ansible_facts['os_family'] }}
      pri_ip: {{ ansible_facts.default_ipv4.addresses }}
      private_IP: {{ansible_facts['default_ipv4['default_ipv4['addresses']']' }}
